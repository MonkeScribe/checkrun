name: Build apps

on:
  push:
    branches: [claude/friendly-albattani-e4g27l]
    paths: [checkrun/**, templates/**, assets/**, run_checkrun.py, .github/workflows/build-apps.yml]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pandas openpyxl "xlrd>=2.0.1" tkinterdnd2 pyinstaller
      - name: Make .icns from the PNG
        run: |
          mkdir icon.iconset
          for s in 16 32 64 128 256 512; do
            sips -z $s $s assets/icon.png --out icon.iconset/icon_${s}x${s}.png
            sips -z $((s*2)) $((s*2)) assets/icon.png --out icon.iconset/icon_${s}x${s}@2x.png
          done
          iconutil -c icns icon.iconset -o assets/icon.icns
      - name: Build .app
        run: |
          pyinstaller --noconfirm --windowed --name CheckRun \
            --icon assets/icon.icns \
            --add-data "templates:templates" \
            --add-data "assets/icon.png:assets" \
            --collect-all tkinterdnd2 \
            --hidden-import xlrd \
            run_checkrun.py
      - name: Zip (keeps the app bundle intact)
        run: cd dist && ditto -c -k --keepParent CheckRun.app CheckRun-mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: CheckRun-mac
          path: dist/CheckRun-mac.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pandas openpyxl "xlrd>=2.0.1" tkinterdnd2 pyinstaller
      - name: Build .exe
        shell: bash
        run: |
          pyinstaller --noconfirm --windowed --onefile --name CheckRun \
            --icon assets/icon.ico \
            --add-data "templates;templates" \
            --add-data "assets/icon.png;assets" \
            --collect-all tkinterdnd2 \
            --hidden-import xlrd \
            run_checkrun.py
      - uses: actions/upload-artifact@v4
        with:
          name: CheckRun-windows
          path: dist/CheckRun.exe
