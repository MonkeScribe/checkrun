name: Build Mac app

on:
  push:
    branches: [claude/friendly-albattani-e4g27l]
    paths: [checkrun/**, templates/**, run_checkrun.py, .github/workflows/build-mac.yml]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pandas openpyxl tkinterdnd2 pyinstaller
      - name: Build .app
        run: |
          pyinstaller --noconfirm --windowed --name CheckRun \
            --add-data "templates:templates" \
            --collect-all tkinterdnd2 \
            run_checkrun.py
      - name: Zip (keeps the app bundle intact)
        run: cd dist && ditto -c -k --keepParent CheckRun.app CheckRun-mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: CheckRun-mac
          path: dist/CheckRun-mac.zip
